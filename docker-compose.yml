version: '3.8'
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"  # Exposes Kafka to the Codespaces host preview if needed
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5

  pyspark:
    image: jupyter/pyspark-notebook:latest
    depends_on:
      - kafka
    environment:
      - PYSPARK_PYTHON=python3
    ports:
      - "8888:8888"   # Jupyter Notebook UI
      - "4040:4040"   # Spark UI
    volumes:
      - ./notebooks:/home/jovyan/work  

  akhq:
    image: tchiotludo/akhq:latest
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            local-kafka:
              properties:
                bootstrap.servers: kafka:9092

  kafka-producer:
    build:
      context: ./kafka
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
    command: ["python", "kafka-producer.py"]
    volumes:
      - ./kafka:/app
    networks:
      - default

  kafka-consumer:
    build:
      context: ./kafka
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
    command: ["python", "kafka-consumer.py"]
    volumes:
      - ./kafka:/app
    networks:
      - default

                